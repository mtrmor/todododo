<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TodoDodo visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #ebeaf0;
        color: #1d1a2b;
        font: 600 14px/1.4 system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      figure { margin: 0; }
      figcaption { margin: 0 0 8px; }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d8d6df;
        border-radius: 12px;
        background: white;
        box-shadow: 0 8px 28px rgba(29, 26, 43, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Reference · 1280 × 618</figcaption>
        <img src="reference-1280x618.jpg" alt="Todo reference" />
      </figure>
      <figure>
        <figcaption>TodoDodo implementation · 1280 × 618</figcaption>
        <img src="search-1280x618-final.png" alt="TodoDodo Search implementation" />
      </figure>
    </main>
  </body>
</html>
